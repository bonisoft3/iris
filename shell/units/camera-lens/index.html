<style>
:root {
  --bg: #081c24;
  --panel: #0d2b36;
  --border: #1e4d5c;
  --teal: #18b797;
  --amber: #ffcb3d;
  --ink: #f0fdfa;
  --muted: #99d5c9;
  --danger: #f87171;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  font: 13px/1.4 var(--font);
  user-select: none;
}
[hidden] { display: none !important; }
#root {
  display: grid;
  gap: 8px;
  background: var(--bg);
  border-radius: 10px;
  padding: 10px;
  border: 1px solid var(--border);
}
.lens-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.status-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--border);
}
.badge[data-tone="active"] {
  background: rgba(24, 183, 151, 0.18);
  color: #5eead4;
  border-color: var(--teal);
}
.badge[data-tone="amber"] {
  background: rgba(255, 203, 61, 0.18);
  color: var(--amber);
  border-color: var(--amber);
}
.badge-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.lens-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.tool-btn {
  min-height: 32px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--ink);
  font: 600 12px/1 var(--font);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tool-btn:hover {
  border-color: var(--teal);
}
.tool-btn.danger {
  border-color: var(--danger);
  color: var(--danger);
  background: rgba(248, 113, 113, 0.14);
}
.tool-btn.danger:hover {
  background: rgba(248, 113, 113, 0.24);
}
.tool-btn:focus-visible, .shutter-btn:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 11;
  background: radial-gradient(circle at 50% 45%, #113a48 0%, #071b24 58%, #041016 100%);
  border-radius: 8px;
  overflow: hidden;
  cursor: crosshair;
  border: 1px solid var(--border);
}
.stage[data-standby="true"] {
  cursor: pointer;
}
.stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#mask-canvas {
  pointer-events: none;
  transition: opacity 160ms ease;
}
.standby-veil {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  text-align: center;
  background:
    radial-gradient(circle at 50% 42%, rgba(24, 183, 151, 0.16) 0%, rgba(8, 28, 36, 0.72) 56%, rgba(4, 16, 22, 0.9) 100%);
  backdrop-filter: blur(22px) saturate(1.25);
  -webkit-backdrop-filter: blur(22px) saturate(1.25);
  pointer-events: none;
  transition: opacity 200ms ease;
}
.standby-aperture {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(24, 183, 151, 0.16);
  border: 1.5px solid rgba(94, 234, 212, 0.45);
  color: #5eead4;
  box-shadow: 0 0 28px rgba(24, 183, 151, 0.28);
  animation: aperture-breathe 2.2s ease-in-out infinite;
}
@keyframes aperture-breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(24, 183, 151, 0.22); }
  50% { transform: scale(1.06); box-shadow: 0 0 34px rgba(24, 183, 151, 0.42); }
}
@media (prefers-reduced-motion: reduce) {
  .standby-aperture { animation: none; }
}
.standby-title {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.standby-sub {
  margin: 0;
  max-width: 34ch;
  font-size: 12px;
  color: var(--muted);
}
.reticle {
  position: absolute;
  inset: 14px;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.corner {
  position: absolute;
  width: 22px;
  height: 22px;
  border-color: var(--teal);
  border-style: solid;
  border-width: 0;
}
.corner.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
.corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
.corner.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
.corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }
.crosshair {
  width: 18px;
  height: 18px;
  position: relative;
  opacity: 0.45;
}
.stage[data-standby="true"] .crosshair {
  opacity: 0;
}
.crosshair::before, .crosshair::after {
  content: "";
  position: absolute;
  background: rgba(255, 255, 255, 0.75);
}
.crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
.crosshair::after { left: 8px; top: 0; width: 2px; height: 18px; }
.keypoint-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid #041016;
  box-shadow: 0 0 0 3px rgba(255, 203, 61, 0.35);
  pointer-events: none;
  transition: left 120ms ease, top 120ms ease;
}
.shutter-flash {
  position: absolute;
  inset: 0;
  background: #ffffff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease;
}
.shutter-flash[data-flash="true"] {
  opacity: 0.85;
}
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.hint-text {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
}
.shutter-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.shutter-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 3px solid var(--teal);
  background: rgba(24, 183, 151, 0.2);
  padding: 4px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 120ms ease, background 120ms ease;
}
.shutter-btn:hover {
  transform: scale(1.04);
  background: rgba(24, 183, 151, 0.32);
}
.shutter-btn:active {
  transform: scale(0.95);
}
.shutter-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--ink);
}
</style>
</head>

function normalizeLocale(raw) {
  const code = String(raw || "").toLowerCase().replace(/_/g, "-").split("-")[0];
  return I18N[code] ? code : "en";
}

function detectInitialLocale() {
  try {
    const ref = document.referrer ? new URL(document.referrer).pathname : "";
    const seg = ref.split("/").filter(Boolean)[0];
    if (seg && I18N[seg]) return seg;
  } catch {
    // Cross-origin referrer parsing is optional; props.locale is authoritative.
  }
  return normalizeLocale(navigator.language || "en");
}

let currentLocale = detectInitialLocale();
let cameraStateKey = "starting";
let aiStateKey = "finderLoading";

function t(key) {
  return (I18N[currentLocale] || I18N.en)[key] || I18N.en[key] || "";
}

function applyLocale() {
  document.documentElement.lang = currentLocale;
  document.documentElement.dir = currentLocale === "he" ? "rtl" : "ltr";
  $("camera-status-text").textContent = t(cameraStateKey);
  $("ai-status-text").textContent = t(aiStateKey);
  $("camera-toggle-btn").textContent = streaming ? t("pause") : t("live");
  $("flip-btn").textContent = t("flip");
  $("upload-btn").textContent = t("upload");
  $("retake-btn").textContent = t("retake");
  $("hint-text").textContent = t("hint");
  $("shutter-btn").setAttribute("aria-label", t("shutterLabel"));
  $("shutter-btn").setAttribute("title", t("shutterLabel"));
  $("stage").setAttribute("aria-label", t("stageLabel"));
  const opening = cameraStateKey === "starting";
  $("standby-title").textContent = opening ? t("standbyOpeningTitle") : t("standbyIdleTitle");
  $("standby-sub").textContent = opening ? t("standbyOpeningSub") : t("standbyIdleSub");
}

function setCameraState(key, tone = "active") {
  cameraStateKey = key;
  $("camera-badge").dataset.tone = tone;
  $("camera-status-text").textContent = t(key);
  const opening = key === "starting";
  $("standby-title").textContent = opening ? t("standbyOpeningTitle") : t("standbyIdleTitle");
  $("standby-sub").textContent = opening ? t("standbyOpeningSub") : t("standbyIdleSub");
}

function setAiState(key, tone = "active") {
  aiStateKey = key;
  $("ai-badge").dataset.tone = tone;
  $("ai-status-text").textContent = t(key);
}

function syncStandbyVeil() {
  const isStandby = !streaming && !capturedCustomFrame;
  $("standby-veil").hidden = !isStandby;
  $("stage").dataset.standby = isStandby ? "true" : "false";
}

function computeCoverFit(child, parent) {
  const childAspect = child.width / child.height;
  const parentAspect = parent.width / parent.height;
  const scaledWidth = childAspect < parentAspect ? parent.width : parent.height * childAspect;
  const scaledHeight = childAspect < parentAspect ? parent.width / childAspect : parent.height;
  const cropX = (parent.width - scaledWidth) / 2;
  const cropY = (parent.height - scaledHeight) / 2;
  return { scaledWidth, scaledHeight, cropX, cropY };
}

function cropToCover(child, parent) {
  const fit = computeCoverFit(child, parent);
  const scale = fit.cropX ? child.height / fit.scaledHeight : child.width / fit.scaledWidth;
  return {
    x: fit.cropX * -1 * scale,
    y: fit.cropY * -1 * scale,
    width: parent.width * scale,
    height: parent.height * scale,
  };
}

function computeGIoU(rect1, rect2) {
  const x1 = rect1.x;
  const y1 = rect1.y;
  const x2 = rect1.x + rect1.width;
  const y2 = rect1.y + rect1.height;
  const x3 = rect2.x;
  const y3 = rect2.y;
  const x4 = rect2.x + rect2.width;
  const y4 = rect2.y + rect2.height;

  const interX1 = Math.max(x1, x3);
  const interY1 = Math.max(y1, y3);
  const interX2 = Math.min(x2, x4);
  const interY2 = Math.min(y2, y4);

  const interW = Math.max(0, interX2 - interX1);
  const interH = Math.max(0, interY2 - interY1);
  const interArea = interW * interH;
  const unionArea = rect1.width * rect1.height + rect2.width * rect2.height - interArea;

  const encX1 = Math.min(x1, x3);
  const encY1 = Math.min(y1, y3);
  const encX2 = Math.max(x2, x4);
  const encY2 = Math.max(y2, y4);
  const encArea = (encX2 - encX1) * (encY2 - encY1);

  if (unionArea <= 0 || encArea <= 0) return -1;
  const iou = interArea / unionArea;
  return iou - (encArea - unionArea) / encArea;
}

const REGION_KEYPOINTS = {
  center: { x: 0.5, y: 0.5 },
  neck: { x: 0.5, y: 0.22 },
  base: { x: 0.5, y: 0.78 },
  full: { x: 0.48, y: 0.48 },
};

const REGION_TARGETS = {
  center: { x: 96, y: 72, width: 288, height: 186 },
  neck: { x: 132, y: 24, width: 216, height: 96 },
  base: { x: 108, y: 180, width: 264, height: 114 },
  full: { x: 48, y: 24, width: 384, height: 282 },
};

function regionFromKeypoint(kp) {
  if (kp.y < 0.34) return "neck";
  if (kp.y > 0.66) return "base";
  if (kp.x < 0.25 || kp.x > 0.75) return "full";
  return "center";
}

let props = { preset: "camera_preset_pet", region: "center", status: "ready", locale: currentLocale };
let lastPreset = "camera_preset_pet";
let lastRegion = "center";
let lastStatus = "ready";
let streaming = false;
let capturedCustomFrame = false;
let cameraUnavailable = false;
let facingMode = "environment";
let segmenter = null;
let segmenterReady = false;
let segmenterError = false;
let activeKeypoint = { x: 0.5, y: 0.5 };
let lastBbox = null;
let lastHeight = -1;

const exportCanvas = document.createElement("canvas");
exportCanvas.width = 320;
exportCanvas.height = 220;
const exportCtx = exportCanvas.getContext("2d");

function reportHeight() {
  const height = Math.ceil($("root").getBoundingClientRect().height);
  if (height <= 0 || height === lastHeight) return;
  lastHeight = height;
  post({ type: "pronto:event", name: "height", height });
}
new ResizeObserver(reportHeight).observe($("root"));

function drawAtmosphericBackdrop() {
  const w = captureCanvas.width;
  const h = captureCanvas.height;
  const base = captureCtx.createLinearGradient(0, 0, w, h);
  base.addColorStop(0, "#05151d");
  base.addColorStop(0.55, "#0b2633");
  base.addColorStop(1, "#041016");
  captureCtx.fillStyle = base;
  captureCtx.fillRect(0, 0, w, h);

  const glow = captureCtx.createRadialGradient(w * 0.5, h * 0.46, 12, w * 0.5, h * 0.46, w * 0.52);
  glow.addColorStop(0, "rgba(24, 183, 151, 0.20)");
  glow.addColorStop(0.55, "rgba(14, 74, 90, 0.14)");
  glow.addColorStop(1, "rgba(4, 16, 22, 0)");
  captureCtx.fillStyle = glow;
  captureCtx.fillRect(0, 0, w, h);
}

function positionKeypointDot(kp) {
  const dot = $("keypoint-dot");
  dot.style.left = `${Math.round(kp.x * 100)}%`;
  dot.style.top = `${Math.round(kp.y * 100)}%`;
}

function drawMaskAndScore(mask, width, height, region) {
  const maskData = mask.getAsUint8Array();
  const imageData = maskCtx.createImageData(width, height);
  const pixels = imageData.data;

  const kpX = Math.min(width - 1, Math.max(0, Math.round(activeKeypoint.x * width)));
  const kpY = Math.min(height - 1, Math.max(0, Math.round(activeKeypoint.y * height)));
  const targetVal = maskData[kpY * width + kpX];

  let minX = width;
  let minY = height;
  let maxX = 0;
  let maxY = 0;
  let fgCount = 0;

  for (let i = 0; i < maskData.length; i++) {
    const isForeground = maskData[i] === targetVal;
    const p = i * 4;
    if (isForeground) {
      pixels[p] = 255;
      pixels[p + 1] = 203;
      pixels[p + 2] = 61;
      pixels[p + 3] = 165;
      const x = i % width;
      const y = (i / width) | 0;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      fgCount++;
    } else {
      pixels[p + 3] = 0;
    }
  }

  maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
  if (fgCount === 0) {
    lastBbox = null;
    setAiState("highlightFailed", "amber");
    return false;
  }
  maskCtx.putImageData(imageData, 0, 0);

  const bbox = { x: minX, y: minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
  lastBbox = bbox;

  maskCtx.strokeStyle = "#ffcb3d";
  maskCtx.lineWidth = 2;
  maskCtx.strokeRect(bbox.x, bbox.y, bbox.width, bbox.height);

  const target = REGION_TARGETS[region] || REGION_TARGETS.center;
  computeGIoU(bbox, target);
  setAiState("highlighted", "active");
  return true;
}

function runSegmentation(kp, regionOverride) {
  activeKeypoint = kp;
  positionKeypointDot(kp);
  const region = regionOverride || regionFromKeypoint(kp);
  lastBbox = null;

  if (!segmenter || !segmenterReady) {
    clearMask();
    setAiState(segmenterError ? "finderUnavailable" : "finderLoading", "amber");
    return { region, segmented: false };
  }

  $("keypoint-dot").hidden = false;
  maskCanvas.style.opacity = "1";
  try {
    const result = segmenter.segment(captureCanvas, { keypoint: kp });
    if (result && result.categoryMask) {
      const ok = drawMaskAndScore(result.categoryMask, captureCanvas.width, captureCanvas.height, region);
      result.categoryMask.close?.();
      if (!ok) $("keypoint-dot").hidden = true;
      return { region, segmented: ok };
    }
  } catch (err) {
    console.warn("camera-lens segmentation failed:", err);
  }
  clearMask();
  setAiState("highlightFailed", "amber");
  return { region, segmented: false };
}

function clearMask() {
  lastBbox = null;
  maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
  $("keypoint-dot").hidden = true;
}

function encodeCompactFrame() {
  const cw = captureCanvas.width;
  const ch = captureCanvas.height;
  let sx = 0, sy = 0, sw = cw, sh = ch;
  if (lastBbox && lastBbox.width > 8 && lastBbox.height > 8 && (lastBbox.width < cw * 0.96 || lastBbox.height < ch * 0.96)) {
    const padX = Math.round(lastBbox.width * 0.2);
    const padY = Math.round(lastBbox.height * 0.2);
    sx = Math.max(0, Math.floor(lastBbox.x - padX));
    sy = Math.max(0, Math.floor(lastBbox.y - padY));
    const ex = Math.min(cw, Math.ceil(lastBbox.x + lastBbox.width + padX));
    const ey = Math.min(ch, Math.ceil(lastBbox.y + lastBbox.height + padY));
    sw = Math.max(16, ex - sx);
    sh = Math.max(16, ey - sy);
  }
  exportCtx.fillStyle = "#071820";
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  const scale = Math.min(exportCanvas.width / sw, exportCanvas.height / sh);
  const dw = Math.round(sw * scale);
  const dh = Math.round(sh * scale);
  const dx = Math.round((exportCanvas.width - dw) / 2);
  const dy = Math.round((exportCanvas.height - dh) / 2);
  exportCtx.drawImage(captureCanvas, sx, sy, sw, sh, dx, dy, dw, dh);
  let url = exportCanvas.toDataURL("image/jpeg", 0.68);
  if (url.length > 52000) {
    url = exportCanvas.toDataURL("image/jpeg", 0.48);
  }
  return url;
}

function emitCapture(seg, includeImage, autoClassify = "true") {
  const region = seg.region || "center";
  const status = seg.segmented ? "segmented" : "ready";
  lastRegion = region;
  lastStatus = status;
  const image_url = includeImage ? encodeCompactFrame() : "";
  raise("capture", {
    image_url,
    segment_region: region,
    segment_status: status,
    preset_label: lastPreset,
    auto_classify: (seg.segmented || capturedCustomFrame) ? autoClassify : "false",
  });
}

async function fetchVerifiedBlobUrl(url, integrity, mimeType) {
  const res = await fetch(url, { integrity, credentials: "omit" });
  if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${url}`);
  const buf = await res.arrayBuffer();
  return URL.createObjectURL(new Blob([buf], { type: mimeType }));
}

async function initMediaPipe() {
  try {
    const [{ InteractiveSegmenter }, wasmLoaderBlobUrl, wasmBinaryBlobUrl, modelBlobUrl] = await Promise.all([
      import("@mediapipe/tasks-vision"),
      fetchVerifiedBlobUrl(WASM_LOADER_URL, WASM_LOADER_SRI, "text/javascript"),
      fetchVerifiedBlobUrl(WASM_BINARY_URL, WASM_BINARY_SRI, "application/wasm"),
      fetchVerifiedBlobUrl(MODEL_URL, MODEL_SRI, "application/octet-stream"),
    ]);

    const fileset = {
      wasmLoaderPath: wasmLoaderBlobUrl,
      wasmBinaryPath: wasmBinaryBlobUrl,
    };

    try {
      segmenter = await InteractiveSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: modelBlobUrl, delegate: "GPU" },
        outputCategoryMask: true,
        outputConfidenceMasks: false,
      });
    } catch {
      segmenter = await InteractiveSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: modelBlobUrl, delegate: "CPU" },
        outputCategoryMask: true,
        outputConfidenceMasks: false,
      });
    }

    segmenterReady = true;
    segmenterError = false;
    setAiState("finderReady", "active");
    if (!streaming && capturedCustomFrame && props.status !== "ready") {
      runSegmentation(activeKeypoint, props.region || "center");
    }
  } catch (err) {
    console.warn("camera-lens MediaPipe init failed:", err);
    segmenterReady = false;
    segmenterError = true;
    clearMask();
    setAiState("finderUnavailable", "amber");
  }
}

function startLiveCamera() {
  cameraUnavailable = false;
  setCameraState("starting", "active");
  syncStandbyVeil();
  post({ type: "pronto:camera", action: "start", facingMode });
}

function stopLiveCamera() {
  streaming = false;
  post({ type: "pronto:camera", action: "stop" });
  $("flip-btn").hidden = true;
  $("camera-toggle-btn").textContent = t("live");
  syncStandbyVeil();
}

function snapAndSegment() {
  if (!streaming && !capturedCustomFrame) {
    if (cameraUnavailable) {
      $("file-input").click();
    } else {
      startLiveCamera();
    }
    return;
  }

  const flash = $("shutter-flash");
  flash.dataset.flash = "true";
  setTimeout(() => { flash.dataset.flash = "false"; }, 160);

  if (streaming) {
    stopLiveCamera();
    capturedCustomFrame = true;
    setCameraState("captured", "active");
  }
  syncStandbyVeil();
  $("retake-btn").hidden = false;

  const kp = activeKeypoint || REGION_KEYPOINTS[props.region] || { x: 0.5, y: 0.5 };
  const seg = runSegmentation(kp, props.region || "center");
  emitCapture(seg, true);
}

$("camera-toggle-btn").addEventListener("click", () => {
  if (streaming) {
    stopLiveCamera();
    setCameraState("paused", "amber");
  } else {
    startLiveCamera();
  }
});

$("flip-btn").addEventListener("click", () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  if (streaming) startLiveCamera();
});

$("retake-btn").addEventListener("click", () => {
  capturedCustomFrame = false;
  $("retake-btn").hidden = true;
  $("file-input").value = "";
  clearMask();
  drawAtmosphericBackdrop();
  syncStandbyVeil();
  raise("capture", {
    image_url: "",
    segment_region: "center",
    segment_status: "ready",
    preset_label: lastPreset,
    auto_classify: "false",
  });
  startLiveCamera();
});

$("upload-btn").addEventListener("click", () => {
  $("file-input").click();
});

$("file-input").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      stopLiveCamera();
      const srcRect = cropToCover(
        { x: 0, y: 0, width: img.naturalWidth || img.width, height: img.naturalHeight || img.height },
        { x: 0, y: 0, width: captureCanvas.width, height: captureCanvas.height },
      );
      captureCtx.drawImage(
        img,
        srcRect.x,
        srcRect.y,
        srcRect.width,
        srcRect.height,
        0,
        0,
        captureCanvas.width,
        captureCanvas.height,
      );
      capturedCustomFrame = true;
      syncStandbyVeil();
      $("retake-btn").hidden = false;
      setCameraState("loaded", "active");
      const seg = runSegmentation({ x: 0.5, y: 0.5 }, "center");
      emitCapture(seg, true);
    };
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
});

$("shutter-btn").addEventListener("click", () => {
  snapAndSegment();
});

$("stage").addEventListener("click", (e) => {
  if (!streaming && !capturedCustomFrame) {
    if (cameraUnavailable) {
      $("file-input").click();
    } else {
      startLiveCamera();
    }
    return;
  }
  const rect = $("stage").getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;
  const x = Math.min(0.96, Math.max(0.04, (e.clientX - rect.left) / rect.width));
  const y = Math.min(0.96, Math.max(0.04, (e.clientY - rect.top) / rect.height));
  if (streaming) {
    stopLiveCamera();
    capturedCustomFrame = true;
    setCameraState("captured", "active");
  }
  syncStandbyVeil();
  $("retake-btn").hidden = false;
  const seg = runSegmentation({ x, y });
  emitCapture(seg, true);
});

function syncProps(nextProps) {
  props = { ...props, ...nextProps };
  if (props.locale) {
    const nextLocale = normalizeLocale(props.locale);
    if (nextLocale !== currentLocale) {
      currentLocale = nextLocale;
      applyLocale();
    }
  }
  const presetChanged = props.preset && props.preset !== lastPreset;
  const regionChanged = props.region && props.region !== lastRegion;
  const statusChanged = props.status && props.status !== lastStatus;

  if (presetChanged) {
    lastPreset = props.preset;
  }

  if (regionChanged || statusChanged || presetChanged) {
    lastRegion = props.region;
    lastStatus = props.status;
    if (props.status === "ready") {
      clearMask();
    } else if (!streaming && capturedCustomFrame) {
      const kp = REGION_KEYPOINTS[props.region] || { x: 0.5, y: 0.5 };
      runSegmentation(kp, props.region);
    }
  }
  reportHeight();
}

addEventListener("message", (e) => {
  if (e.source !== parent) return;
  const message = e.data;
  if (message === null || typeof message !== "object") return;

  if (message.type === "pronto:props") {
    syncProps(message.props || {});
    return;
  }

  if (message.type === "pronto:camera") {
    if (message.status === "streaming") {
      streaming = true;
      cameraUnavailable = false;
      clearMask();
      syncStandbyVeil();
      setCameraState("live", "active");
      $("camera-toggle-btn").textContent = t("pause");
      $("flip-btn").hidden = false;
      return;
    }
    if (message.status === "frame" && message.bitmap) {
      const bmp = message.bitmap;
      if (streaming) {
        capturedCustomFrame = true;
        syncStandbyVeil();
        const srcRect = cropToCover(
          { x: 0, y: 0, width: bmp.width, height: bmp.height },
          { x: 0, y: 0, width: captureCanvas.width, height: captureCanvas.height },
        );
        captureCtx.drawImage(
          bmp,
          srcRect.x,
          srcRect.y,
          srcRect.width,
          srcRect.height,
          0,
          0,
          captureCanvas.width,
          captureCanvas.height,
        );
      }
      bmp.close?.();
      return;
    }
    if (message.status === "stopped") {
      streaming = false;
      $("flip-btn").hidden = true;
      setCameraState("paused", "amber");
      $("camera-toggle-btn").textContent = t("live");
      syncStandbyVeil();
      return;
    }
    if (message.status === "error") {
      streaming = false;
      cameraUnavailable = true;
      setCameraState("fallbackBadge", "amber");
      $("camera-toggle-btn").textContent = t("live");
      syncStandbyVeil();
      return;
    }
  }
});

drawAtmosphericBackdrop();
clearMask();
applyLocale();
syncStandbyVeil();
post({ type: "pronto:ready" });
reportHeight();
initMediaPipe();
startLiveCamera();
</script>
</body>
</html>
