<!-- camera — ir: #camera. Live camera capture, interactive MediaPipe segmentation, and classification submission. -->
<section class="screen" data-screen="camera" id="screen-camera">
  <input type="radio" name="iris-theme-camera" id="theme-auto-chk" class="theme-radio theme-auto-chk" checked>
  <input type="radio" name="iris-theme-camera" id="theme-light-chk" class="theme-radio theme-light-chk">
  <input type="radio" name="iris-theme-camera" id="theme-dark-chk" class="theme-radio theme-dark-chk">
  <p class="offline role-meta" data-text="{msg.offline}">Iris is offline — waiting for connection.</p>

  <header class="brand-topbar camera-hero">
    <div class="brand-topbar-row">
      <div class="brand-topbar-copy camera-hero-copy">
        <div class="brand-topbar-title-row">
          <img class="brand-logo-img" src="/pictures/25275fc0e139d54350917c4ccecf5999c40df6c1c8df37aa27035bfe7d9a6e09.svg" alt="" width="45" height="26">
          <h1 class="camera-title role-band" data-text="{msg.camera_title}">Scan &amp; Classify Waste Specimen</h1>
          <a class="secondary-cta role-meta" data-route="gallery" data-param-shelf="gallery" data-text="{msg.back_gallery}">← Back to Gallery</a>
        </div>
      </div>
      <div class="camera-hero-actions header-utility-actions sidebar-user-controls">
        <details class="sidebar-settings-details">
          <summary class="sidebar-settings-btn role-label">
            <span class="settings-label-text" data-text="{msg.settings_label}">⚙️ Settings</span>
          </summary>
          <div class="sidebar-settings-popover">
            <div class="settings-group">
              <span class="settings-group-label role-label" data-text="{msg.settings_theme_label}">Theme</span>
              <div class="theme-switch" role="group">
                <label for="theme-auto-chk" class="theme-btn role-label" data-theme-opt="auto" data-text="{msg.theme_auto}">Auto</label>
                <label for="theme-light-chk" class="theme-btn role-label" data-theme-opt="light" data-text="{msg.theme_light}">☀️</label>
                <label for="theme-dark-chk" class="theme-btn role-label" data-theme-opt="dark" data-text="{msg.theme_dark}">🌙</label>
              </div>
            </div>
            <div class="settings-group">
              <span class="settings-group-label role-label" data-text="{msg.settings_lang_label}">Language</span>
              <div class="lang-switch">
                <a class="lang-link role-label" id="lang-en" data-route="camera" data-locale="en" data-locale-current="page" data-text="{msg.lang_code_en}">EN</a>
                <a class="lang-link role-label" id="lang-es" data-route="camera" data-locale="es" data-locale-current="page" data-text="{msg.lang_code_es}">ES</a>
                <a class="lang-link role-label" id="lang-pt" data-route="camera" data-locale="pt" data-locale-current="page" data-text="{msg.lang_code_pt}">PT</a>
                <a class="lang-link role-label" id="lang-ru" data-route="camera" data-locale="ru" data-locale-current="page" data-text="{msg.lang_code_ru}">RU</a>
                <a class="lang-link role-label" id="lang-he" data-route="camera" data-locale="he" data-locale-current="page" data-text="{msg.lang_code_he}">HE</a>
                <a class="lang-link role-label" id="lang-kk" data-route="camera" data-locale="kk" data-locale-current="page" data-text="{msg.lang_code_kk}">KK</a>
              </div>
            </div>
          </div>
        </details>
      </div>
    </div>
  </header>

  <div class="skeleton" aria-hidden="true">
    <div class="skel card-skel"></div>
    <div class="skel card-skel"></div>
  </div>

  <div class="camera-workspace" data-live="scan_draft" data-filter="id=eq.draft" data-reads="scan_draft" data-on-mutation="scan_draft">
    <template data-item>
      <div class="camera-split">
        <section class="camera-lens-card" aria-label="{msg.camera_lens_heading}">
          <div class="camera-hatch-mount" id="camera-lens-mount" data-hatch="camera-lens"
               data-on-capture="scan_draft"
               data-prop-preset="{preset_label}"
               data-prop-region="{segment_region}"
               data-prop-status="{segment_status}"
               data-prop-locale="{user_language}"
               aria-label="{msg.camera_lens_heading}"></div>

          <figure class="lens-frame" data-region="{segment_region}" data-segment-status="{segment_status}">
            <div class="lens-stage">
              <img class="lens-preview-img" src="{image_url}" alt="" width="640" height="440">
            </div>
            <figcaption class="lens-caption">
              <span class="lens-city-tag role-meta" data-text="{user_city}">São Paulo</span>
            </figcaption>
          </figure>
        </section>

        <section class="camera-submit-column">
          <div class="scan-form-card">
            <h2 class="section-title role-band" data-text="{msg.camera_form_heading}">Identify &amp; Get Disposal Guide</h2>
            <p class="scan-form-sub role-meta" data-text="{msg.camera_form_sub}">Tap the item in your photo to highlight it, confirm your city, and get instant disposal steps.</p>

            <form class="scan-form" data-form="submit-scan" data-entity="track_request" data-action="create">
              <input type="hidden" name="image_url" data-value="{image_url}">
              <input type="hidden" name="model" data-value="{model}">
              <input type="hidden" name="user_language" data-value="{user_language}">

              <label class="field">
                <span class="field-label role-label" data-text="{msg.camera_city_label}">Your City</span>
                <input type="text" name="user_city" required maxlength="80" data-value="{user_city}">
              </label>

              <div class="form-actions">
                <button type="submit" id="submit-scan-btn" class="primary-cta role-body" data-text="{msg.camera_submit_btn}">Identify Item</button>
                <p class="saved role-meta" role="status" data-text="{msg.camera_form_saved}">Item classified! Check your result below.</p>
                <p class="invalid role-meta" hidden data-text="{msg.camera_form_invalid}">Please enter your city.</p>
                <p class="store-error role-meta" role="status" hidden data-text="{msg.camera_form_error}">Could not classify this photo right now.</p>
              </div>
            </form>
          </div>

          <div class="camera-results-scope" data-live="me" data-empty="">
            <template data-item>
              <section class="generated-scans-banner" id="camera-results-banner" aria-labelledby="camera-results-heading">
                <div class="gen-progress-header">
                  <h2 id="camera-results-heading" class="section-title role-band" data-text="{msg.camera_recent_heading}">Your Scanned Items</h2>
                  <a class="card-open-link role-meta" data-route="gallery" data-param-shelf="mine" aria-label="{msg.camera_view_all_queue}" data-text="{msg.camera_view_all_queue}">Open Gallery →</a>
                </div>
                <div class="keep-scans-offer">
                  <p class="keep-scans-copy role-meta" data-text="{msg.keep_scans_offer}">Your scanned items are only in this browser for now. Save them to this device to sign in to them anywhere.</p>
                  <button type="button" id="btn-keep-scans" class="btn-primary role-label" data-auth-action="passkey-register" data-text="{msg.keep_scans_action}">Save to this device</button>
                </div>

                <div class="camera-queue-list" data-live="track_request" data-filter="user_id=eq.{id}&amp;status=neq.classified" data-order="created_at.desc,id.asc" data-empty="">
                  <template data-item>
                    <article class="scan-queue-row" data-status="{status}">
                      <img class="scan-queue-thumb" src="{image_url}" alt="" width="56" height="56">
                      <div class="scan-queue-copy">
                        <div class="scan-queue-top">
                          <span class="phase-pill phase-pill-active role-label" data-status="{status}" data-text="{msg.status_classifying}">Identifying…</span>
                          <span class="phase-pill phase-pill-failed role-label" data-status="{status}" data-text="{msg.status_failed}">Failed</span>
                          <span class="role-meta" data-text="{user_city}">São Paulo</span>
                          <button type="button" class="btn-delete-inline role-label" data-command="delete-request" data-on-click="scan_draft" data-text="{msg.request_delete_confirm}">Confirm Delete</button>
                        </div>
                      </div>
                    </article>
                  </template>
                </div>

                <div class="camera-results-list" id="camera-results-list" data-live="trash_item" data-filter="user_id=eq.{id}&amp;tagged_as_inappropriate=eq.false" data-order="created_at.desc,id.asc" data-reads="trash_item,trash_item_translation,localized_item,me" data-on-mutation="localize_content">
                  <p data-empty class="empty role-meta" data-text="{msg.my_requests_empty}">Take a photo above and click Identify to get your disposal guide right here.</p>
                  <template data-item>
                    <article class="scan-result-card" data-category="{label}">
                      <div class="scan-result-main">
                        <img class="scan-result-thumb" src="{picture}" alt="{caption}" width="72" height="72">
                        <div class="scan-result-body">
                          <div class="scan-result-badges">
                            <span class="chip role-label" data-category="{label}">
                              <span data-text="{msg[label_key]}">Recyclable</span>
                            </span>
                            <span class="phase-pill role-label" data-status="classified" data-text="{msg.status_classified}">Ready</span>
                          </div>
                          <h3 class="scan-result-title scan-result-title-fallback role-body" data-text="{caption}">Recyclable Bottle</h3>
                          <p class="scan-result-material scan-result-material-fallback role-meta" data-text="{object_material}">PET Plastic</p>
                        </div>
                      </div>
                      <p class="scan-result-steps scan-result-steps-fallback role-meta" data-text="{disposal_instructions}">Empty liquid, quick-rinse, and place in the dry recyclables bin.</p>
                      <div class="scan-result-localized-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                        <template data-item>
                          <div class="scan-result-localized-meta" data-translated="{translated}" data-locale="{locale}">
                            <h3 class="scan-result-title role-body" data-text="{caption}"></h3>
                            <p class="scan-result-material role-meta" data-text="{object_material}"></p>
                            <p class="scan-result-steps role-meta" data-text="{disposal_instructions}"></p>
                          </div>
                        </template>
                      </div>
                      <div class="scan-result-footer">
                        <a class="scan-result-cta role-meta" data-route="detail" data-param-id="{id}" data-text="{msg.inspect_item_cta}">See how to discard →</a>
                        <button type="button" class="btn-delete-inline role-label" data-command="delete-item" data-on-click="scan_draft" data-text="{msg.lifecycle_delete_confirm}">Confirm Permanent Delete</button>
                      </div>
                    </article>
                  </template>
                </div>
                <ul class="camera-translations-sync" data-live="trash_item_translation" data-order="language.asc,id.asc" data-empty="" data-reads="trash_item,trash_item_translation,localized_item,me" data-on-mutation="localize_content" hidden>
                  <template data-item>
                    <li data-text="{id}"></li>
                  </template>
                </ul>
                <ul id="translation-timeout" data-live="localized_item" data-filter="translated=eq.pending" data-order="id.asc" data-empty="" data-reads="localized_item,trash_item_translation" data-on-mutation="localize_content" hidden>
                  <template data-item>
                    <li data-text="{id}"></li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </section>
      </div>
    </template>
  </div>
</section>
