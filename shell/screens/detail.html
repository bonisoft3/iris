<!-- detail — ir: #detail. Tabbed waste specimen inspection, localized disposal guides, and nearby recycling hubs. -->
<section class="screen" data-screen="detail">
  <input type="radio" name="iris-theme-detail" id="theme-auto-chk" class="theme-radio theme-auto-chk" checked>
  <input type="radio" name="iris-theme-detail" id="theme-light-chk" class="theme-radio theme-light-chk">
  <input type="radio" name="iris-theme-detail" id="theme-dark-chk" class="theme-radio theme-dark-chk">
  <header class="brand-topbar detail-topbar">
    <div class="brand-topbar-row">
      <div class="brand-topbar-copy">
        <div class="brand-topbar-title-row">
          <img class="brand-logo-img" src="/pictures/25275fc0e139d54350917c4ccecf5999c40df6c1c8df37aa27035bfe7d9a6e09.svg" alt="" width="45" height="26">
          <a class="back-link role-meta" data-route="gallery" data-param-shelf="gallery" data-text="{msg.back_gallery}">← Back to Gallery</a>
          <span class="live-pill role-label" data-text="{msg.detail_ai_badge}">AI Detected • Verified Specimen</span>
        </div>
      </div>
      <div class="header-utility-actions sidebar-user-controls">
        <details class="sidebar-settings-details">
          <summary class="sidebar-settings-btn role-label">
            <span class="settings-label-text" data-text="{msg.settings_label}">⚙️ Settings</span>
          </summary>
          <div class="sidebar-settings-popover">
            <div class="settings-group">
              <span class="settings-group-label role-label" data-text="{msg.settings_theme_label}">Theme</span>
              <div class="theme-switch" role="group">
                <label for="theme-auto-chk" class="theme-btn role-label" data-theme-opt="auto" data-text="{msg.theme_auto}">Auto</label>
                <label for="theme-light-chk" class="theme-btn role-label" data-theme-opt="light" data-text="{msg.theme_light}">☀️</label>
                <label for="theme-dark-chk" class="theme-btn role-label" data-theme-opt="dark" data-text="{msg.theme_dark}">🌙</label>
              </div>
            </div>
            <div class="settings-group">
              <span class="settings-group-label role-label" data-text="{msg.settings_lang_label}">Language</span>
              <div class="lang-switch">
                <a class="lang-link role-label" id="lang-en" data-route="detail" data-param-id="{param.id}" data-locale="en" data-locale-current="page" data-text="{msg.lang_code_en}">EN</a>
                <a class="lang-link role-label" id="lang-es" data-route="detail" data-param-id="{param.id}" data-locale="es" data-locale-current="page" data-text="{msg.lang_code_es}">ES</a>
                <a class="lang-link role-label" id="lang-pt" data-route="detail" data-param-id="{param.id}" data-locale="pt" data-locale-current="page" data-text="{msg.lang_code_pt}">PT</a>
                <a class="lang-link role-label" id="lang-ru" data-route="detail" data-param-id="{param.id}" data-locale="ru" data-locale-current="page" data-text="{msg.lang_code_ru}">RU</a>
                <a class="lang-link role-label" id="lang-he" data-route="detail" data-param-id="{param.id}" data-locale="he" data-locale-current="page" data-text="{msg.lang_code_he}">HE</a>
                <a class="lang-link role-label" id="lang-kk" data-route="detail" data-param-id="{param.id}" data-locale="kk" data-locale-current="page" data-text="{msg.lang_code_kk}">KK</a>
              </div>
            </div>
          </div>
        </details>
      </div>
    </div>
  </header>

  <p class="offline role-meta" data-text="{msg.offline}">Iris cannot reach the server right now.</p>

  <div class="skeleton" aria-hidden="true">
    <div class="skel detail-skel"></div>
  </div>

  <div class="detail-workspace" data-live="detail_view" data-filter="id=eq.view" data-empty="">
    <template data-item>
      <div class="detail-tabs-root" data-tab="{tab}">
        <div class="detail-wrap" data-live="trash_item" data-filter="id=eq.{param.id}" data-empty="{msg.item_not_found}" data-reads="trash_item,trash_item_translation,localized_item,me" data-on-mutation="localize_content">
          <template data-item>
            <article class="detail-layout" data-category="{label}" data-disposal-place="{is_disposal_place}">
              <div class="panel visual-panel">
                <div class="visual-frame">
                  <img class="detail-img" src="{picture}" alt="" width="480" height="360">
                  <div class="visual-top-overlay">
                    <div class="badge-row">
                      <span class="place-badge chip role-label" data-text="{msg.disposal_place_badge}">Registered Drop-off Bin</span>
                    </div>
                  </div>
                </div>
                <div class="visual-bottom-overlay">
                  <h1 class="detail-title role-title" data-text="{caption}"></h1>
                  <div class="hero-localized-title-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                    <template data-item>
                      <p class="hero-localized-title role-title" data-translated="{translated}" data-locale="{locale}" data-text="{caption}"></p>
                    </template>
                  </div>
                  <p class="contributor-line role-meta">
                    <span data-text="{msg.scanned_by_label}">Scanned by</span>
                    <span class="author-probe" data-live="app_user" data-filter="id=eq.{user_id}" data-empty="">
                      <template data-item>
                        <span class="author-item">
                          <b class="author-name" data-text="{display_name}"></b>
                          <span class="author-handle" data-text="{handle}"></span>
                        </span>
                      </template>
                    </span>
                  </p>
                  <div class="owner-actions-slot" data-live="me" data-filter="id=eq.{user_id}" data-empty="">
                    <template data-item>
                      <div class="owner-actions-bar">
                        <button type="button" id="delete-detail-item" class="btn-delete-inline role-label" data-command="delete-item" data-on-click="detail_view" data-text="{msg.lifecycle_delete_confirm}">Confirm Permanent Delete</button>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="inspection-column">
                <header class="panel summary-panel">
                  <div class="panel-body summary-banner-body">
                    <div class="summary-status-row">
                      <span class="summary-kicker role-label" data-text="{msg[label_key]}">Recyclable</span>
                      <span class="detail-value detail-value-fallback role-label">
                        <b data-text="{msg.estimated_value_label}">Estimated Recovery Value</b>:
                        <span data-text="{price}"></span>
                      </span>
                    </div>
                    <p class="detail-material detail-material-fallback role-body">
                      <b data-text="{msg.material_label}">Material</b>:
                      <span data-text="{object_material}"></span>
                    </p>
                    <div class="summary-localized-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                      <template data-item>
                        <div class="summary-localized-meta" data-translated="{translated}" data-locale="{locale}">
                          <p class="detail-material role-body">
                            <b data-text="{msg.material_label}">Material</b>:
                            <span data-text="{object_material}"></span>
                          </p>
                          <p class="detail-value role-label">
                            <b data-text="{msg.estimated_value_label}">Estimated Recovery Value</b>:
                            <span data-text="{price}"></span>
                          </p>
                        </div>
                      </template>
                    </div>
                  </div>
                </header>

                <div class="detail-tab-bar" role="tablist">
                  <button type="button" id="tab-discard" class="tab-btn role-label" data-on-click="detail_view" data-text="{msg.detail_tab_discard}">How to Discard</button>
                  <button type="button" id="tab-details" class="tab-btn role-label" data-on-click="detail_view" data-text="{msg.detail_tab_details}">Material &amp; Streams</button>
                  <button type="button" id="tab-nearby" class="tab-btn role-label" data-on-click="detail_view" data-text="{msg.detail_tab_nearby}">Nearby Centers</button>
                </div>

                <div class="pane-discard">
                  <section class="panel instructions-panel">
                    <h2 class="band role-band"><span data-text="{msg.disposal_steps_heading}">How to Discard</span></h2>
                    <div class="panel-body instructions-body">
                      <p class="instructions-copy role-body" data-text="{disposal_instructions}"></p>
                      <div class="localized-live-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                        <template data-item>
                          <div class="localized-live-card" data-translated="{translated}" data-locale="{locale}">
                            <div class="localized-live-head">
                              <span class="lang-badges">
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="en" data-text="{msg.lang_en}">English</span>
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="es" data-text="{msg.lang_es}">Español</span>
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="pt" data-text="{msg.lang_pt}">Português</span>
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="ru" data-text="{msg.lang_ru}">Русский</span>
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="he" data-text="{msg.lang_he}">עברית</span>
                                <span class="chip role-label lang-pill localized-locale-pill" data-lang-id="kk" data-text="{msg.lang_kk}">Қазақша</span>
                              </span>
                              <strong class="localized-live-caption role-band" data-text="{caption}"></strong>
                            </div>
                            <p class="localized-live-steps role-body" data-text="{disposal_instructions}"></p>
                          </div>
                        </template>
                      </div>
                    </div>
                  </section>

                  <section class="panel translations-panel">
                    <h2 class="band role-band"><span data-text="{msg.translations_heading}">Localized Disposal Guides</span></h2>
                    <div class="panel-body translation-form-wrap">
                      <form class="translation-form" data-form="request-translation" data-entity="translation_request" data-action="create">
                        <input type="hidden" name="item_id" data-value="{id}">
                        <div class="translation-form-row">
                          <label class="translation-field">
                            <span class="field-label role-label" data-text="{msg.detail_translate_label}">Translate disposal guide into</span>
                            <select name="language" id="translation-language" required>
                              <option value="en" data-text="{msg.lang_en}">English</option>
                              <option value="es" data-text="{msg.lang_es}">Español</option>
                              <option value="pt" data-text="{msg.lang_pt}">Português</option>
                              <option value="ru" data-text="{msg.lang_ru}">Русский</option>
                              <option value="he" data-text="{msg.lang_he}">עברית</option>
                              <option value="kk" data-text="{msg.lang_kk}">Қазақша</option>
                            </select>
                          </label>
                          <button type="submit" id="request-translation-btn" class="primary-cta role-body" data-text="{msg.detail_translate_btn}">Translate Guide</button>
                        </div>
                        <p class="saved role-meta" role="status" data-text="{msg.detail_translate_saved}">Localized disposal guide generated.</p>
                        <p class="invalid role-meta" hidden data-text="{msg.detail_translate_invalid}">Please select a target language.</p>
                        <p class="store-error role-meta" role="status" hidden data-text="{msg.detail_translate_error}">Could not translate specimen.</p>
                      </form>
                    </div>
                    <ul class="translation-list" data-live="trash_item_translation"
                        data-filter="item_id=eq.{id}"
                        data-order="language.asc,id.asc"
                        data-empty="{msg.translations_empty}"
                        data-reads="trash_item,trash_item_translation,localized_item,me"
                        data-on-mutation="localize_content">
                      <template data-item>
                        <li class="translation-card" data-lang="{language}">
                          <div class="translation-head">
                            <span class="lang-badges">
                              <span class="chip role-label lang-pill" data-lang-id="en" data-text="{msg.lang_en}">English</span>
                              <span class="chip role-label lang-pill" data-lang-id="es" data-text="{msg.lang_es}">Español</span>
                              <span class="chip role-label lang-pill" data-lang-id="pt" data-text="{msg.lang_pt}">Português</span>
                              <span class="chip role-label lang-pill" data-lang-id="ru" data-text="{msg.lang_ru}">Русский</span>
                              <span class="chip role-label lang-pill" data-lang-id="he" data-text="{msg.lang_he}">עברית</span>
                              <span class="chip role-label lang-pill" data-lang-id="kk" data-text="{msg.lang_kk}">Қазақша</span>
                            </span>
                            <h3 class="translation-caption role-band" data-text="{caption}"></h3>
                          </div>
                          <p class="translation-steps role-body" data-text="{disposal_instructions}"></p>
                        </li>
                      </template>
                    </ul>
                    <ul id="translation-timeout" data-live="localized_item"
                        data-filter="translated=eq.pending"
                        data-order="id.asc"
                        data-empty=""
                        data-reads="localized_item,trash_item_translation"
                        data-on-mutation="localize_content" hidden>
                      <template data-item>
                        <li data-text="{id}"></li>
                      </template>
                    </ul>
                  </section>
                </div>

                <div class="pane-details">
                  <section class="panel streams-panel">
                    <h2 class="band role-band"><span data-text="{msg.sub_classifications_heading}">Sub-classifications &amp; Streams</span></h2>
                    <div class="panel-body streams-body">
                      <p class="streams-copy streams-copy-fallback role-body" data-text="{sub_classifications}"></p>
                      <div class="streams-localized-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                        <template data-item>
                          <p class="streams-copy streams-copy-localized role-body" data-translated="{translated}" data-locale="{locale}" data-text="{sub_classifications}"></p>
                        </template>
                      </div>
                    </div>
                  </section>
                </div>

                <div class="pane-nearby">
                  <section class="panel nearby-panel">
                    <h2 class="band role-band"><span data-text="{msg.nearby_places_heading}">Nearby Recycling &amp; Drop-off Centers</span></h2>
                    <div class="panel-body nearby-body">
                      <p class="nearby-copy nearby-copy-fallback role-meta" data-text="{nearby_recycling_places}"></p>
                      <div class="nearby-localized-slot" data-live="localized_item" data-filter="id=eq.{id}" data-empty="">
                        <template data-item>
                          <p class="nearby-copy nearby-copy-localized role-meta" data-translated="{translated}" data-locale="{locale}" data-text="{nearby_recycling_places}"></p>
                        </template>
                      </div>
                    </div>
                  </section>

                  <section class="panel hubs-panel">
                    <h2 class="band role-band"><span data-text="{msg.nearby_hubs_heading}">Matching Neighborhood Drop-off Hubs</span></h2>
                    <ul class="nearby-hub-list" data-live="disposal_place"
                        data-filter="material_type=eq.{label}"
                        data-order="created_at.desc,id.asc"
                        data-empty="{msg.nearby_hubs_empty}">
                      <template data-item>
                        <li class="hub-card" data-category="{material_type}">
                          <img class="hub-thumb" src="{img_url}" alt="" width="72" height="72">
                          <div class="hub-body">
                            <div class="hub-badges">
                              <span class="chip role-label" data-text="{msg[material_key]}"></span>
                              <span class="hub-distance role-label" data-text="{distance_km}"></span>
                            </div>
                            <h3 class="hub-name role-band" data-text="{name}"></h3>
                            <p class="hub-address role-meta">
                              <b data-text="{msg.address_label}">Address</b>:
                              <span data-text="{address}"></span>
                            </p>
                            <p class="hub-phone role-meta">
                              <b data-text="{msg.phone_label}">Phone</b>:
                              <span data-text="{phone_number}"></span>
                            </p>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </section>
                </div>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>
</section>
