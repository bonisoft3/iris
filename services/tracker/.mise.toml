[settings]
locked = true
github.slsa = false
github.github_attestations = false
lockfile = true
experimental = true
paranoid = false
github_attestations = false
slsa = false
aqua.github_attestations = false
aqua.cosign = false
aqua.slsa = false
aqua.minisign = false

[tools]
java = "openjdk-25.0"
"github:go-task/task" = "v3.49.1"
"github:jdx/pitchfork" = "v2.18.0"   # for detached sayt launch

# http: backend — URL template works for macOS/Linux; Windows override below.
[tools."http:skaffold"]
version = "2.18.1"
url = 'https://storage.googleapis.com/skaffold/releases/v{{ version }}/skaffold-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}'

[tools."http:skaffold".platforms]
windows-x64 = { url = 'https://storage.googleapis.com/skaffold/releases/v{{ version }}/skaffold-windows-amd64.exe' }

[env]
# `.say.yaml` holds every project to this and says why it differs per checkout.
# The activated branch must not read the variable back: mise renders before it
# drops its previous injection, so `get_env` there carries the last directory's
# name across a cd. Unactivated, there is no hook and nothing stale to read.
COMPOSE_PROJECT_NAME = '''{% if get_env(name='MISE_SHELL', default='') != '' %}{{ exec(command='mise tool-stub ../../plugins/sayt/nu.toml ../../plugins/sayt/compose.nu compose-project') }}{% else %}{{ get_env(name='COMPOSE_PROJECT_NAME', default='') }}{% endif %}'''
