volumes:
  root-dot-docker-cache-mount: {}
services:
  develop:
    volumes:
      - ${DEVSERVER:+/root/.dcm}${DEVSERVER:-root-dot-docker-cache-mount}:/root/.dcm
      - //var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    environment:
      - DEVSERVER=true
    build:
      context: ../..
      dockerfile: ${DOCKERFILE:-plugins/devserver/Dockerfile}
      target: debug
    secrets:
      - host.env

  integrate:
    command: "true"
    build:
      context: ../..
      dockerfile: ${DOCKERFILE:-plugins/devserver/Dockerfile}
      network: host
      target: integrate
      secrets:
        - host.env

secrets:
  host.env:
    environment: HOST_ENV
