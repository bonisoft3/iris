say:
  generate:
    rulemap: { "auto-cue": null }

  integrate:
    # act reaches the host daemon from a build RUN through docker-bridge.sh, which
    # finds it only in the host.env the docker bridge writes.
    args: "--with-host-env"

  lint:
    # devserver's image runs lazybox's mise launcher, whose attestation
    # switches keep every build off GitHub's unauthenticated API; a copy that
    # drifted from it rate-limited the builds that share one address.
    copy:
      - plugins/lazybox/lazy-mise
      - plugins/devserver/lazy-mise
    # Playwright's client refuses a browser of another version, so every pin
    # moves together: omnishell's helpers and their consumers, the checks that
    # drive a browser, the visual battery's image, and the browser CI installs.
    # Bumping it means editing this literal too — a partial bump fails here as
    # "pattern not found". Lockfiles and generated trees follow these.
    shared:
      - pattern: '1\.61\.1'
        files:
          - package.json
          - guis/snapcards/package.json
          - guis/iris/package.json
          - guis/iris/tests/playwright/package.json
          - guis/iris/tests/playwright/Dockerfile
          - guis/iris/bayt.cue
          - plugins/omnishell/package.json
          - .github/workflows/ci.yml
          - plugins/bayt/core/images.lock.cue
          - plugins/omnishell/check-visual.ts
          - plugins/omnishell/playwright-tests/deno.json
          - plugins/omnishell/playwright-tests/harness.ts
          - plugins/omnishell/test/deno.json
          - apps/golaberto/tests/acceptance.ts
          - apps/jsfb/bench/h2h.ts
          - apps/plausible/tests/appearance.ts
          - apps/primer/tests/paint.ts
          - apps/snapcards/tests/acceptance.ts
          - apps/truco/tests/acceptance.ts

      # The door answers Electric's 5xx with its status and headers and none
      # of its text (libraries/mecha/services/proxy/Caddyfile says why), in
      # mecha's proxy and in the Caddyfile pronto emits for every app.
      - pattern: 'exclude Content-Type Content-Length Content-Encoding Server'
        files:
          - libraries/mecha/services/proxy/Caddyfile
          - plugins/pronto/assets/Caddyfile
      - pattern: 'respond .\{"message":"electric failed"\}. \{rp\.status_code\}'
        files:
          - libraries/mecha/services/proxy/Caddyfile
          - plugins/pronto/assets/Caddyfile

      # nushell's version is restated in every mise config and tool stub that
      # needs it, and none can import it from another. A partial bump puts two
      # interpreters in play — see .justfile's generate-all for what that does
      # to the generated tree — and fails here as "pattern not found", naming
      # the file that was missed.
      #
      # plugins/shall/compose.yaml is deliberately outside this: it apk-adds
      # nushell from the wolfi index, which prunes old versions, so a pin
      # there is a build failure with a date on it. Its container runs only
      # shall.test.nu and writes nothing generated.
      - pattern: '0\.116\.1'
        files:
          - .mise.toml
          - plugins/shall/.mise.toml
          - plugins/lazybox/mise.toml
          - plugins/sayt/nu.toml
          - plugins/sayt/nu.musl.toml
          - plugins/bayt/runtime/nu.toml
          - plugins/bayt/runtime/nu.musl.toml
          - plugins/devserver/stubs/nu.toml
          - plugins/devserver/stubs/nu_plugin_custom_values.toml
          - plugins/devserver/stubs/nu_plugin_example.toml
          - plugins/devserver/stubs/nu_plugin_formats.toml
          - plugins/devserver/stubs/nu_plugin_gstat.toml
          - plugins/devserver/stubs/nu_plugin_inc.toml
          - plugins/devserver/stubs/nu_plugin_polars.toml
          - plugins/devserver/stubs/nu_plugin_query.toml
          - plugins/devserver/stubs/nu_plugin_stress_internals.toml

    rulemap:
      # Compose derives its project from a directory basename, which every
      # checkout shares, so a worktree joins the main checkout's stack and
      # `down -v` takes it down. Each project with a stack publishes the name
      # sayt resolves from `[env]` in its `.mise.toml`, which is scaffold-owned,
      # so no generator writes it. This parses each file rather than matching a
      # line, because a key outside `[env]` publishes nothing and a line pattern
      # can't see which table it sits in. Found rather than listed, so a new
      # project is checked without being named here.
      # A project with no `.mise.toml` is outside mise and has nowhere to publish
      # the name.
      compose-project:
        cmds:
          - do: |
              let found = (ls apps/*/compose.yaml services/*/compose.yaml | get name
                | each { |c| $c | path dirname }
                | where { |d| ($d | path join .mise.toml) | path exists }
                # mise.local.toml layers over .mise.toml, as mise reads them: an
                # app built as its own repository names the monorepo's sayt only
                # in the monorepo-only file.
                | each { |d| { project: $d, value: ([.mise.toml mise.local.toml]
                    | each { |f| $d | path join $f } | where { path exists }
                    | each { |f| open $f | get -o env.COMPOSE_PROJECT_NAME } | compact | last) } })
              let missing = ($found | where value == null | get project)
              if ($missing | is-not-empty) {
                error make {msg: $"COMPOSE_PROJECT_NAME is not under [env] in: ($missing | str join ', ')"}
              }
              if ($found | get value | uniq | length) > 1 {
                error make {msg: "COMPOSE_PROJECT_NAME is spelled differently across projects"}
              }
              # A tool stub with a cold cache resolves this `[env]` too, so the
              # exec's child must not see MISE_SHELL, or it execs again without
              # bound (plugins/sayt/compose_test.nu checks both prefixes work).
              let reentrant = ($found | where { |f| not (($f.value | str contains 'MISE_SHELL= mise tool-stub') and ($f.value | str contains '(set MISE_SHELL=) && mise tool-stub')) } | get project)
              if ($reentrant | is-not-empty) {
                error make {msg: $"COMPOSE_PROJECT_NAME's exec keeps MISE_SHELL in: ($reentrant | str join ', ')"}
              }
