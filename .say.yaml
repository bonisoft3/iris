say:
  generate:
    rulemap: { "auto-cue": null }

  integrate:
    # act reaches the host daemon from a build RUN through dind.sh, which
    # finds it only in the host.env the dind bridge writes.
    args: "--with-host-env"

  lint:
    # omnishell's playwright helpers are imported by both guis/iris and
    # guis/snapcards, so every consumer plus the base image whose chromium they
    # drive must carry one version. Bumping it means editing this literal too —
    # a partial bump fails here as "pattern not found".
    shared:
      - pattern: '1\.59\.1'
        files:
          - package.json
          - guis/snapcards/package.json
          - guis/iris/package.json
          - guis/iris/tests/playwright/package.json
          - guis/iris/bayt.cue
          - plugins/omnishell/package.json

      # nushell's version is restated in every mise config and tool stub that
      # needs it, and none can import it from another. A partial bump puts two
      # interpreters in play — see .justfile's generate-all for what that does
      # to the generated tree — and fails here as "pattern not found", naming
      # the file that was missed.
      #
      # plugins/shall/compose.yaml is deliberately outside this: it apk-adds
      # nushell from the wolfi index, which prunes old versions, so a pin
      # there is a build failure with a date on it. Its container runs only
      # shall.test.nu and writes nothing generated.
      - pattern: '0\.115\.1'
        files:
          - .mise.toml
          - plugins/shall/.mise.toml
          - plugins/lazybox/mise.toml
          - plugins/sayt/nu.toml
          - plugins/sayt/nu.musl.toml
          - plugins/bayt/runtime/nu.toml
          - plugins/bayt/runtime/nu.musl.toml
          - plugins/devserver/stubs/nu.toml
          - plugins/devserver/stubs/nu_plugin_custom_values.toml
          - plugins/devserver/stubs/nu_plugin_example.toml
          - plugins/devserver/stubs/nu_plugin_formats.toml
          - plugins/devserver/stubs/nu_plugin_gstat.toml
          - plugins/devserver/stubs/nu_plugin_inc.toml
          - plugins/devserver/stubs/nu_plugin_polars.toml
          - plugins/devserver/stubs/nu_plugin_query.toml
          - plugins/devserver/stubs/nu_plugin_stress_internals.toml

    rulemap:
      # Compose derives its project from a directory basename, which every
      # checkout shares, so a worktree joins the main checkout's stack and
      # `down -v` takes it down. Each project with a stack publishes the name
      # sayt resolves from `[env]` in its `.mise.toml`, which is scaffold-owned,
      # so no generator writes it. This parses each file rather than matching a
      # line, because a key outside `[env]` publishes nothing and a line pattern
      # can't see which table it sits in. Found rather than listed, so a new
      # project is checked without being named here.
      # A project with no `.mise.toml` is outside mise and has nowhere to publish
      # the name.
      compose-project:
        cmds:
          - do: |
              let found = (ls apps/*/compose.yaml services/*/compose.yaml | get name
                | each { |c| $c | path dirname }
                | where { |d| ($d | path join .mise.toml) | path exists }
                | each { |d| { project: $d, value: (open ($d | path join .mise.toml) | get -o env.COMPOSE_PROJECT_NAME) } })
              let missing = ($found | where value == null | get project)
              if ($missing | is-not-empty) {
                error make {msg: $"COMPOSE_PROJECT_NAME is not under [env] in: ($missing | str join ', ')"}
              }
              if ($found | get value | uniq | length) > 1 {
                error make {msg: "COMPOSE_PROJECT_NAME is spelled differently across projects"}
              }
