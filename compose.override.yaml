# The dind session's projection, as every other consumer takes it
# (guis/flashcards, guis/web, products/iris, plugins/devserver): sayt exports
# HOST_ENV and compose's environment-backed secret reads it straight out. A
# path-backed form needs a caller to write the file first, and an unwritten one
# resolves to the context directory — which buildkit refuses with
# "read <dir>: is a directory" rather than an empty secret.
secrets:
  host.env:
    environment: HOST_ENV
